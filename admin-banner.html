<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kelola Banner | MC-SAGARANTEN</title>

<link rel="icon" type="image/png" href="./img/favicon.png">
<link rel="stylesheet" href="./css/kelola-banner.css">
<link rel="stylesheet" href="./css/global-bottom.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="page-header">
    <a href="dashboard.html" class="back-button" aria-label="Kembali">‹</a>

    <div class="header-logo">
        <img src="img/favicon.png" alt="MC-SAGARANTEN">
    </div>

    <div class="header-text">
        <div class="header-title">Kelola Banner</div>
        <div class="header-subtitle">Pengelolaan banner MC-SAGARANTEN</div>
    </div>
</header>

<main class="banner-admin-container">

    <section class="report-heading">
        <div class="report-heading-left">
            <div class="report-heading-title">Administrator Banner</div>
            <div class="report-heading-desc">Pengelolaan banner dashboard</div>
        </div>
    </section>

    <button class="add-banner-btn" id="btn-add-banner">
        ＋ Tambah Banner
    </button>

    <div class="banner-list" id="banner-list">
        <div class="loading">Memuat banner...</div>
    </div>

</main>

<div class="banner-modal" id="banner-modal">

    <div class="banner-modal-box">

        <div class="banner-modal-title" id="modal-title">
            Tambah Banner
        </div>

        <div class="form-group">
            <label>Judul Banner</label>
            <input
                type="text"
                id="banner-judul"
                placeholder="Contoh: Promo Agustus"
            >
        </div>

        <div class="form-group">
            <label>Link Banner</label>
            <input
                type="text"
                id="banner-link"
                placeholder="https://... atau #"
            >
        </div>

        <div class="form-group">
            <label>Urutan</label>
            <input
                type="number"
                id="banner-urutan"
                min="1"
                value="1"
            >
        </div>

        <div class="form-group">
            <label>Gambar Banner</label>

            <input
                type="file"
                id="banner-file"
                accept="image/jpeg,image/png,image/webp"
            >

            <div class="file-info" id="file-info">
                Maksimal 5 MB.
            </div>

            <div class="form-preview" id="form-preview">
                <img id="preview-image" alt="Preview">
            </div>
        </div>

        <label class="active-switch">
            <input type="checkbox" id="banner-aktif" checked>
            Banner aktif
        </label>

        <div class="modal-actions">

            <button
                class="modal-btn modal-cancel"
                id="btn-cancel"
            >
                Batal
            </button>

            <button
                class="modal-btn modal-save"
                id="btn-save"
            >
                Simpan
            </button>

        </div>

    </div>

</div>

<div class="banner-toast" id="banner-toast"></div>

<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>

<script src="./js/notif.js"></script>
<script src="./js/kelola-banner.js"></script>

</body>
</html>
