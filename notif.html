<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifikasi - MC-SAGARANTEN</title>

<link rel="stylesheet" href="./css/global-navhed.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<div class="notif-page">

<header class="notif-header">

    <button
        class="notif-back"
        onclick="goBack()"
        aria-label="Kembali"
    >
        <span class="notif-back-arrow"></span>
    </button>

    <div class="notif-header-title">
        Notifikasi
    </div>

    <div class="notif-header-subtitle">
        Pembaruan terbaru MC-SAGARANTEN
    </div>

</header>

<section class="notif-summary">

    <div class="notif-summary-top">

        <div>
            <div class="notif-summary-label">
                Belum dibaca
            </div>
        </div>

        <div
            class="notif-summary-count"
            data-notif-unread
        >
            0
        </div>

    </div>

    <div class="notif-filter">

        <button
            class="active"
            data-filter="all"
        >
            Semua
        </button>

        <button data-filter="unread">
            Belum Dibaca
        </button>

    </div>

</section>

<main
    class="notif-list"
    id="notif-list"
></main>

<div class="notif-actions">

    <button
        class="notif-action-button"
        id="btn-mark-all"
        type="button"
    >
        Tandai Semua Dibaca
    </button>

    <button
        class="notif-action-button danger"
        id="btn-clear-all"
        type="button"
    >
        Hapus Semua
    </button>

</div>

</div>

<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item active">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>
<script type="module" src="./js/dashboard-auth.js"></script>
<script src="./js/notif.js"></script>
<script src="./js/notif-html.js"></script>
</body>
</html>
