<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semua Banner | MC-SAGARANTEN</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/semua-banner.css">
    <link rel="stylesheet" href="./css/global-bottom.css">
    <link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="banner-page-header">

    <div class="header-left">

        <button
            type="button"
            class="back-button"
            id="btnBack"
            aria-label="Kembali"
        >
            ‹
        </button>

        <div class="header-logo">
            <img src="./img/favicon.png" alt="MC-SAGARANTEN">
        </div>

        <div class="header-title">
            <div class="header-title-main">Semua Banner</div>
            <div class="header-title-sub">Informasi • Promo • Program</div>
        </div>

    </div>

    <div class="header-brand">MC-SAGARANTEN</div>

</header>


<main class="banner-page-content">

    <div class="page-section-title">

        <div>
            <div class="section-title-main">● Informasi Terbaru</div>
            <div class="section-title-sub">
                Semua informasi banner yang tersedia
            </div>
        </div>

        <div class="banner-count" id="bannerCount">
            0 Banner
        </div>

    </div>


    <div class="banner-loading-page" id="bannerLoading">

        <div class="loading-spinner"></div>

        <div>Memuat banner...</div>

    </div>


    <div
        class="banner-error"
        id="bannerError"
        style="display:none;"
    >

        <div class="error-icon">⚠️</div>

        <div class="error-title">
            Banner gagal dimuat
        </div>

        <div class="error-desc">
            Silakan coba lagi.
        </div>

        <button
            type="button"
            id="btnRetry"
            class="retry-button"
        >
            Coba Lagi
        </button>

    </div>


    <div
        class="banner-empty-page"
        id="bannerEmpty"
        style="display:none;"
    >

        <div class="empty-icon">🖼️</div>

        <div class="empty-title">
            Belum ada banner
        </div>

        <div class="empty-desc">
            Belum tersedia informasi terbaru saat ini.
        </div>

    </div>


    <div class="banner-grid" id="bannerGrid"></div>

</main>


<div
    class="banner-preview-modal"
    id="bannerPreviewModal"
    aria-hidden="true"
>

    <div class="preview-box">

        <button
            type="button"
            class="preview-close"
            id="previewClose"
        >
            ×
        </button>

        <img
            id="previewImage"
            src=""
            alt="Preview Banner"
        >

        <div
            class="preview-title"
            id="previewTitle"
        ></div>

        <div class="preview-actions">

            <button
                type="button"
                class="preview-download"
                id="previewDownload"
            >
                📥 Download
            </button>

            <button
                type="button"
                class="preview-share"
                id="previewShare"
            >
                📤 Share
            </button>

        </div>

    </div>

</div>

<div
    id="toast-container"
    class="toast-container"
></div>

<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>
<script src="./js/global-log.js"></script>
<script src="./js/notif.js"></script>
<script type="module" src="./js/dashboard-auth.js"></script>
<script src="./js/semua-banner.js"></script>

</body>
</html>
