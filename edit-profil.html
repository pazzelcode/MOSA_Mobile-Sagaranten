<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Profil | MC-SAGARANTEN</title>
<link rel="icon" type="image/png" href="./img/favicon.png">
<link rel="stylesheet" href="./css/edit-profil.css">
<link rel="stylesheet" href="./css/global-bottom.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="edit-profile-header">
    <div class="back-container" id="backBtn">
        <div class="back-button"></div>
    </div>

    <div class="edit-header-icon">
        <i class="fa-solid fa-user-pen"></i>
    </div>

    <div class="edit-header-title">EDIT PROFIL</div>
    <div class="edit-header-subtitle">Perbarui informasi akun Anda</div>
</header>

<main class="edit-profile-card">

    <!-- NAMA -->
    <div class="form-group">
        <label for="namaInput" class="form-label">NAMA</label>
        <div class="input-wrapper">
            <div class="input-icon">
                <i class="fa-solid fa-user"></i>
            </div>
            <input
                type="text"
                id="namaInput"
                class="form-input"
                placeholder="Masukkan nama"
                autocomplete="name"
                maxlength="100"
            >
        </div>
    </div>

    <!-- NOMOR HP -->
    <div class="form-group">
        <label for="nomorInput" class="form-label">NOMOR HP</label>
        <div class="input-wrapper">
            <div class="input-icon">
                <i class="fa-solid fa-phone"></i>
            </div>
            <input
                type="tel"
                id="nomorInput"
                class="form-input"
                placeholder="Masukkan nomor HP"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="15"
            >
        </div>
        <div class="form-hint">
            Nomor HP digunakan sebagai identitas login.
        </div>
    </div>

    <!-- ROLE -->
    <div class="readonly-group">
        <div class="readonly-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="readonly-info">
            <div class="readonly-label">ROLE</div>
            <div class="readonly-value" id="roleValue">-</div>
        </div>
        <div class="readonly-badge">TETAP</div>
    </div>

    <!-- STATUS -->
    <div class="readonly-group">
        <div class="readonly-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="readonly-info">
            <div class="readonly-label">STATUS AKUN</div>
            <div class="readonly-value" id="statusValue">-</div>
        </div>
        <div class="readonly-badge">TETAP</div>
    </div>

    <!-- BUTTON -->
    <div class="form-actions">
        <button type="button" class="cancel-btn" id="cancelBtn">
            BATAL
        </button>

        <button type="button" class="save-btn" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>SIMPAN</span>
        </button>
    </div>

    <!-- INFO -->
    <div class="edit-info">
        <i class="fa-solid fa-circle-info"></i>
        <span>
            Perubahan nama dan nomor HP akan disimpan ke akun Anda.
        </span>
    </div>

</main>

<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon">
                <i class="fa-solid fa-bell fa-outline"></i>
            </span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item active">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>

<script src="./js/global-log.js"></script>
<script type="module" src="./js/dashboard-auth.js"></script>
<script src="./js/notif.js"></script>
<script type="module" src="./js/edit-profil.js"></script>

</body>
</html>
