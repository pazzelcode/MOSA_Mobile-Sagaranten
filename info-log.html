<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Info Log - MC-SAGARANTEN</title>

<link rel="stylesheet" href="./css/info-log.css">
<link rel="stylesheet" href="./css/global-bottom.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<div class="sticky-container">
    <header class="header-wrapper">

        <div class="back-container" onclick="goBack()">
            <div class="back-button"></div>
        </div>

        <div class="app-header">
            <h1>Info Log Aktivitas</h1>
            <p>Monitoring akses dan pengunduhan data</p>
        </div>

    </header>
</div>

<div class="content-wrapper">

    <div class="grid-stats">

        <div class="stat-card">
            <div class="stat-label">Total Pengunjung</div>
            <div id="totalVisitor" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Total Download</div>
            <div id="totalDownload" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Log Hari Ini</div>
            <div id="todayLogCount" class="stat-value">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Update Terakhir</div>
            <div
                id="lastUpdate"
                class="stat-value"
                style="font-size:14px;"
            >-</div>
        </div>

    </div>

    <div class="card">

        <div class="card-title">📜 Riwayat Terakhir</div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>User</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="logBody"></tbody>

            </table>

        </div>

    </div>

</div>

<footer class="bottom-nav">

    <a href="index.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>

<script src="./js/notif.js"></script>
<script src="./js/info-log.js"></script>

</body>
</html>
