<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KPI September | MC-SAGARANTEN</title>

    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/global-bottom.css">
    <link rel="stylesheet" href="./css/notif.css">

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            -webkit-tap-highlight-color:transparent;
        }

        body{
            min-height:100vh;
            padding-bottom:80px;
            background:#f8fafc;
            color:#1e293b;
            font-family:Arial,sans-serif;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header-wrapper{
            position:relative;
            width:100%;
            height:170px;
            overflow:hidden;
            z-index:10;
            text-align:center;
            color:#fff;
            background:linear-gradient(135deg,#1e3a8a,#2563eb);
            border-radius:0 0 30px 30px;
            box-shadow:0 8px 25px rgba(30,58,138,.25);
        }

        .back-container{
            position:absolute;
            top:20px;
            left:15px;
            z-index:20;
            width:38px;
            height:38px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            background:rgba(255,255,255,.18);
            border:1px solid rgba(255,255,255,.28);
            border-radius:50%;
            box-shadow:0 4px 10px rgba(15,23,42,.15);
            transition:.2s ease;
        }

        .back-button{
            width:11px;
            height:11px;
            margin-left:4px;
            border-left:3px solid #fff;
            border-bottom:3px solid #fff;
            transform:rotate(45deg);
        }

        .back-container:active{
            transform:scale(.92);
            background:rgba(255,255,255,.28);
        }

        .app-header{
            padding:55px 20px 20px;
        }

        .app-header h1{
            font-size:20px;
            font-weight:800;
        }

        .app-header p{
            margin-top:5px;
            font-size:11px;
            opacity:.82;
        }

        /* =========================================================
           CONTENT
        ========================================================= */

        .content-wrapper{
            position:relative;
            z-index:20;
            max-width:550px;
            margin:-20px auto 0;
            padding:0 15px 30px;
        }

        .kpi-card{
            overflow:hidden;
            background:#fff;
            border:1px solid #eef2f7;
            border-radius:20px;
            box-shadow:0 8px 25px rgba(15,23,42,.10);
        }

        .kpi-header{
            padding:22px 20px 16px;
            text-align:center;
        }

        .kpi-icon{
            width:58px;
            height:58px;
            margin:0 auto 12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:27px;
            background:linear-gradient(135deg,#dbeafe,#eff6ff);
            border-radius:17px;
            box-shadow:0 6px 15px rgba(37,99,235,.12);
        }

        .kpi-title{
            color:#1e3a8a;
            font-size:18px;
            font-weight:800;
        }

        .kpi-subtitle{
            margin-top:5px;
            color:#64748b;
            font-size:11px;
        }

        /* =========================================================
           KPI IMAGE
        ========================================================= */

        .kpi-image-wrapper{
            margin:0 14px 18px;
            padding:8px;
            background:#f8fafc;
            border:1px solid #e2e8f0;
            border-radius:16px;
        }

        .kpi-image{
            display:block;
            width:100%;
            height:auto;
            border-radius:11px;
        }

        /* =========================================================
           INFO
        ========================================================= */

        .kpi-info{
            margin:0 20px 20px;
            padding:14px 15px;
            color:#64748b;
            background:#f8fafc;
            border:1px solid #eef2f7;
            border-radius:13px;
            text-align:center;
            font-size:10px;
            line-height:1.6;
        }

        .kpi-info strong{
            color:#2563eb;
        }

        .back-home{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 22px;
            padding:11px 20px;
            color:#fff;
            background:#2563eb;
            border-radius:12px;
            text-decoration:none;
            font-size:11px;
            font-weight:800;
            box-shadow:0 6px 15px rgba(37,99,235,.20);
            transition:.2s ease;
        }

        .back-home:active{
            transform:scale(.96);
        }

        .button-wrapper{
            display:flex;
            justify-content:center;
        }

        .footer-text{
            margin-top:20px;
            color:#cbd5e1;
            text-align:center;
            font-size:9px;
        }

        /* =========================================================
           BOTTOM NAV
        ========================================================= */

        .bottom-nav{
            position:fixed;
            left:0;
            bottom:0;
            z-index:1000;
            width:100%;
            height:65px;
            display:flex;
            align-items:center;
            justify-content:space-around;
            background:linear-gradient(
                135deg,
                #fff 0%,
                #fff 25%,
                #f7faff 42%,
                #edf4ff 62%,
                #dce9ff 100%
            );
            border-radius:20px 20px 0 0;
            box-shadow:0 -4px 12px rgba(15,23,42,.10);
        }

        .bottom-item{
            position:relative;
            flex:1;
            height:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:5px;
            color:#475569;
            text-decoration:none;
            font-size:10px;
            font-weight:700;
            letter-spacing:.5px;
            transition:.2s;
        }

        .bottom-item > div,
        .bottom-item > span{
            transform:translateY(4px);
        }

        .bottom-item div{
            font-size:20px;
            filter:drop-shadow(0 2px 3px rgba(15,23,42,.25));
        }

        .bottom-item.active{
            color:#475569;
        }

        .bottom-item.active::before{
            content:"";
            position:absolute;
            top:0;
            left:28%;
            right:28%;
            height:3.5px;
            background:linear-gradient(
                90deg,
                #1e3a8a,
                #2563eb,
                #60a5fa
            );
            border-radius:0 0 5px 5px;
        }

        .bottom-item:active{
            opacity:.6;
            transform:scale(.96);
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media(max-width:380px){

            .content-wrapper{
                padding-left:12px;
                padding-right:12px;
            }

            .kpi-header{
                padding-left:15px;
                padding-right:15px;
            }

            .kpi-title{
                font-size:17px;
            }

        }

/* =========================================================
   KPI IMAGE
========================================================= */

.kpi-image-wrapper{
    position:relative;
    margin:0 14px 18px;
    padding:8px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:16px;
    cursor:pointer;
}

.kpi-image{
    display:block;
    width:100%;
    height:auto;
    border-radius:11px;
    transition:.2s ease;
}

.kpi-image:active{
    transform:scale(.985);
}

.image-hint{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:8px;
    padding:7px;
    color:#64748b;
    font-size:9px;
}

.image-hint i{
    color:#2563eb;
    font-size:10px;
}


/* =========================================================
   FULLSCREEN
========================================================= */

.kpi-fullscreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(15,23,42,.96);

    opacity:0;
    transition:opacity .2s ease;
}

.kpi-fullscreen.show{
    display:flex;
    opacity:1;
}

.kpi-fullscreen img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;

    object-fit:contain;

    border-radius:8px;

    user-select:none;
    -webkit-user-select:none;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.kpi-close{
    position:absolute;
    top:15px;
    right:15px;

    z-index:2;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;

    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;

    font-size:20px;

    cursor:pointer;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:.2s ease;
}

.kpi-close:active{
    transform:scale(.9);
    background:rgba(255,255,255,.28);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .kpi-fullscreen{
        padding:8px;
    }

    .kpi-fullscreen img{
        max-width:100%;
        max-height:95%;
        border-radius:5px;
    }

}

    </style>
</head>

<body>

<header class="header-wrapper">

    <div class="back-container" onclick="goBack()">
        <div class="back-button"></div>
    </div>

    <div class="app-header">
        <h1>KPI September</h1>
        <p>Marketing & Monitoring</p>
    </div>

</header>


<main class="content-wrapper">

    <div class="kpi-card">

        <div class="kpi-header">

            <div class="kpi-icon">
                📊
            </div>

            <div class="kpi-title">
                KPI September
            </div>

            <div class="kpi-subtitle">
                Key Performance Indicator • September 2026
            </div>

        </div>


        <!-- =====================================================
             GAMBAR KPI CLOUDINARY
             GANTI URL DI BAWAH INI
        ====================================================== -->

        <!-- =====================================================
     KPI IMAGE
====================================================== -->

<div class="kpi-image-wrapper">

    <img
        id="kpiImage"
        class="kpi-image"
        src="https://res.cloudinary.com/szj67w13/image/upload/v1788362748/IMG-20260902-WA0006.jpg"
        alt="KPI September 2026"
        loading="lazy"
        onclick="openKpiFullscreen()"
    >

    <div class="image-hint">
        <i class="fa-solid fa-expand"></i>
        Ketuk gambar untuk melihat penuh
    </div>

</div>


<!-- =====================================================
     FULLSCREEN KPI
====================================================== -->

<div id="kpiFullscreen" class="kpi-fullscreen">

    <button
        class="kpi-close"
        onclick="closeKpiFullscreen()"
        aria-label="Tutup"
    >
        <i class="fa-solid fa-xmark"></i>
    </button>

    <img
        id="kpiFullscreenImage"
        src=""
        alt="KPI September 2026"
    >

</div>

        <div class="kpi-info">
            <strong>KPI September 2026</strong><br>
            Informasi target dan pencapaian KPI periode September.
        </div>


        <div class="button-wrapper">
            <a href="dashboard.html" class="back-home">
                Kembali ke Beranda
            </a>
        </div>

    </div>


    <div class="footer-text">
        MC-SAGARANTEN • Sistem Informasi & Monitoring
    </div>

</main>


<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div>
            <i class="fa-solid fa-house fa-outline"></i>
        </div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div>
            <i class="fa-solid fa-chart-column fa-outline"></i>
        </div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon">
                <i class="fa-solid fa-bell fa-outline"></i>
            </span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div>
            <i class="fa-solid fa-user fa-outline"></i>
        </div>
        <span>PROFIL</span>
    </a>

</footer>



<script>

function openKpiFullscreen(){

    const image = document.getElementById('kpiImage');
    const fullscreen = document.getElementById('kpiFullscreen');
    const fullscreenImage = document.getElementById('kpiFullscreenImage');

    if(!image || !fullscreen || !fullscreenImage){
        return;
    }

    fullscreenImage.src = image.src;

    fullscreen.style.display = 'flex';

    requestAnimationFrame(() => {
        fullscreen.classList.add('show');
    });

    document.body.style.overflow = 'hidden';

}


function closeKpiFullscreen(){

    const fullscreen = document.getElementById('kpiFullscreen');

    if(!fullscreen){
        return;
    }

    fullscreen.classList.remove('show');

    setTimeout(() => {
        fullscreen.style.display = 'none';
    }, 200);

    document.body.style.overflow = '';

}


/* Klik area gelap untuk menutup */
document.getElementById('kpiFullscreen')?.addEventListener('click', function(e){

    if(e.target === this){
        closeKpiFullscreen();
    }

});


/* Tombol BACK Android / browser */
document.addEventListener('keydown', function(e){

    if(e.key === 'Escape'){
        closeKpiFullscreen();
    }

});

function goBack(){

    if(
        document.referrer &&
        document.referrer !== location.href
    ){
        history.back();
    }else{
        location.href = 'dashboard.html';
    }

}

</script>


<script src="./js/global-log.js"></script>
<script type="module" src="./js/dashboard-auth.js"></script>
<script src="./js/notif.js"></script>

</body>
</html>
