<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kelola Data File | MC-SAGARANTEN</title>

<link rel="icon" type="image/png" href="./img/favicon.png">
<link rel="stylesheet" href="./css/kelola-file.css">
<link rel="stylesheet" href="./css/global-bottom.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="page-header">

    <a href="index.html" class="back-button" aria-label="Kembali">‹</a>

    <div class="header-logo">
        <img src="img/favicon.png" alt="MC-SAGARANTEN">
    </div>

    <div class="header-text">
        <div class="header-title">Kelola Data File</div>
        <div class="header-subtitle">
            Pengelolaan file unduhan MC-SAGARANTEN
        </div>
    </div>

</header>

<main class="file-admin-container">

    <section class="report-heading">
        <div class="report-heading-left">
            <div class="report-heading-title">
                Administrator File Unduhan
            </div>
            <div class="report-heading-desc">
                Tambah, edit, atau nonaktifkan file unduhan laporan
            </div>
        </div>
    </section>

    <button class="add-file-btn" id="btn-add-file">
        ＋ Tambah Data File
    </button>

    <div class="file-list" id="file-list">
        <div class="loading">Memuat daftar file...</div>
    </div>

</main>

<div class="file-modal" id="file-modal">

    <div class="file-modal-box">

        <div class="file-modal-title" id="modal-title">
            Tambah Data File
        </div>

        <div class="form-group">
            <label>Key File (Unik, Tanpa Spasi)</label>
            <input
                type="text"
                id="file-key"
                placeholder="Contoh: mobo, penjualan, stok_gudang"
            >
        </div>

        <div class="form-group">
            <label>Nama File</label>
            <input
                type="text"
                id="file-nama"
                placeholder="Contoh: Report Mobo"
            >
        </div>

        <div class="form-group">
            <label>Deskripsi Singkat</label>
            <textarea
                id="file-desc"
                rows="2"
                placeholder="Contoh: Laporan penjualan saldo mobo dse"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Upload File Excel dari Perangkat</label>

            <input
                type="file"
                id="file-upload"
                accept=".xlsx,.xls,.csv"
            >

            <div class="file-info" id="file-info-label">
                Format: .xlsx, .xls, .csv (Maksimal 10 MB).<br>
                <span
                    id="current-file-status"
                    style="color:#2563eb;font-weight:700;"
                ></span>
            </div>
        </div>

        <div class="form-group">
            <label>Urutan Tampilan</label>
            <input
                type="number"
                id="file-urutan"
                min="1"
                value="1"
            >
        </div>

        <label class="active-switch">
            <input
                type="checkbox"
                id="file-aktif"
                checked
            >
            File aktif / ditampilkan ke publik
        </label>

        <div class="modal-actions">
            <button
                class="modal-btn modal-cancel"
                id="btn-cancel"
            >
                Batal
            </button>

            <button
                class="modal-btn modal-save"
                id="btn-save"
            >
                Simpan
            </button>
        </div>

    </div>

</div>

<div class="file-toast" id="file-toast"></div>

<footer class="bottom-nav">

    <a href="index.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>

<script src="./js/global-log.js"></script>
<script src="./js/notif.js"></script>
<script src="./js/kelola-file.js"></script>

</body>
</html>
