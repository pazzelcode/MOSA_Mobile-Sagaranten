<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Program Outlet | MC-SAGARANTEN</title>

    <link rel="icon" type="image/png" href="./img/favicon.png">
    <link rel="stylesheet" href="./css/program-outlet.css">
    <link rel="stylesheet" href="./css/global-bottom.css">
    <link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="page-header">

    <a href="dashboard.html" class="back-button">‹</a>

    <div class="header-logo">
        <img src="./img/favicon.png" alt="MC-SAGARANTEN">
    </div>

    <div class="header-text">
        <div class="header-title">Program Outlet</div>
        <div class="header-subtitle">
            Informasi Program & Promo Outlet
        </div>
    </div>

    <button
        class="refresh-button"
        id="refresh-button"
        type="button"
    >
        ↻
    </button>

</header>


<main class="program-container">

    <section class="program-heading">

        <div class="program-heading-title">
            🏪 Program Outlet
        </div>

        <div class="program-heading-desc">
            Lihat berbagai informasi program,
            promo dan aktivitas outlet terbaru.
        </div>

    </section>


    <section
        class="program-gallery"
        id="program-gallery"
    >

        <div class="program-loading">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>

    </section>

</main>


<div class="image-viewer" id="image-viewer">

    <div class="viewer-header">

        <button
            class="viewer-close"
            id="viewer-close"
            type="button"
        >
            ×
        </button>

        <div
            class="viewer-title"
            id="viewer-title"
        >
            Program Outlet
        </div>

        <div
            class="viewer-counter"
            id="viewer-counter"
        >
            1 / 1
        </div>

    </div>


    <div
        class="viewer-stage"
        id="viewer-stage"
    >

        <button
            class="viewer-arrow viewer-prev"
            id="viewer-prev"
            type="button"
        >
            ‹
        </button>

        <img
            class="viewer-image"
            id="viewer-image"
            src=""
            alt=""
        >

        <button
            class="viewer-arrow viewer-next"
            id="viewer-next"
            type="button"
        >
            ›
        </button>

    </div>


    <div class="viewer-footer">

        <button
            class="viewer-button"
            id="viewer-share"
            type="button"
        >
            ↗ Bagikan
        </button>

        <button
            class="viewer-button"
            id="viewer-open"
            type="button"
        >
            🔗 Buka Link
        </button>

    </div>

</div>

<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>
<script src="./js/global-log.js"></script>
<script src="./js/notif.js"></script>
<script src="./js/program-outlet.js"></script>

</body>
</html>
