<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Kelola Program Outlet | MC-SAGARANTEN</title>

<link rel="stylesheet" href="./css/admin-program.css">
<link rel="stylesheet" href="./css/global-bottom.css">
<link rel="stylesheet" href="./css/notif.css">
</head>

<body>

<header class="page-header">
    <a href="dashboard.html" class="back-button">‹</a>

    <div class="header-text">
        <div class="header-title">Kelola Program Outlet</div>
        <div class="header-subtitle">Administrator • Program Outlet</div>
    </div>
</header>

<main class="admin-container">

    <div class="report-heading">
        <div class="report-heading-title">🏪 Program Outlet</div>
        <div class="report-heading-desc">
            Kelola gambar, informasi dan status program outlet.
        </div>
    </div>

    <button class="add-program-btn" id="add-program" type="button">
        ＋ Tambah Program Outlet
    </button>

    <div class="program-list" id="program-list">
        <div class="loading">Memuat program...</div>
    </div>

</main>

<div class="modal" id="program-modal">

    <div class="modal-box">

        <div class="modal-title" id="modal-title">
            Tambah Program Outlet
        </div>

        <form id="program-form">

            <div class="form-group">
                <label>Judul Program</label>
                <input
                    type="text"
                    id="judul"
                    required
                    placeholder="Contoh: Program Outlet Merdeka"
                >
            </div>

            <div class="form-group">
                <label>Deskripsi</label>
                <textarea
                    id="deskripsi"
                    placeholder="Deskripsi singkat program..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Gambar Program</label>

                <div class="file-box">
                    <input
                        type="file"
                        id="gambar"
                        accept="image/*"
                    >
                </div>

                <div class="form-preview" id="form-preview">
                    <img
                        id="preview-image"
                        src=""
                        alt="Preview"
                    >
                </div>
            </div>

            <div class="form-group">
                <label>
                    Link Program
                    <small>(opsional)</small>
                </label>

                <input
                    type="url"
                    id="link"
                    placeholder="https://..."
                >
            </div>

            <div class="form-group">
                <label>Urutan</label>
                <input
                    type="number"
                    id="urutan"
                    min="1"
                    value="1"
                >
            </div>

            <label class="active-switch">
                <input type="checkbox" id="aktif" checked>
                Program aktif
            </label>

            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-btn modal-cancel"
                    id="cancel-modal"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="modal-btn modal-save"
                    id="save-program"
                >
                    Simpan
                </button>

            </div>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>
<footer class="bottom-nav">

    <a href="dashboard.html" class="bottom-item">
        <div><i class="fa-solid fa-house fa-outline"></i></div>
        <span>HOME</span>
    </a>

    <a href="report.html" class="bottom-item">
        <div><i class="fa-solid fa-chart-column fa-outline"></i></div>
        <span>REPORT</span>
    </a>

    <a href="notif.html" class="bottom-item">
        <div class="notif-container">
            <span class="bell-icon"><i class="fa-solid fa-bell fa-outline"></i></span>
            <span class="notif-badge"></span>
        </div>
        <span>NOTIF</span>
    </a>

    <a href="profil.html" class="bottom-item">
        <div><i class="fa-solid fa-user fa-outline"></i></div>
        <span>PROFIL</span>
    </a>

</footer>
<script type="module" src="./js/dashboard-auth.js"></script>
<script src="./js/notif.js"></script>
<script type="module" src="./js/admin-program.js"></script>

</body>
</html>
